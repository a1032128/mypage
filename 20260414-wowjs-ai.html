<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>Simple Animation Demo</title>

    <!-- animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            text-align: center;
        }

        .section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            color: #4fc3f7;
        }

        .spacer {
            height: 100vh;
        }
    </style>
</head>

<body>

    <!-- 第一段（進場動畫） -->
    <div class="section">
        <div class="icon animate__animated animate__bounceIn">
            <i class="fa-solid fa-star"></i>
        </div>
        <h1 class="animate__animated animate__fadeInDown">Welcome</h1>
    </div>

    <div class="spacer"></div>

    <!-- 滾動觸發動畫 -->
    <div class="section">
        <div class="icon wow animate__animated animate__fadeInUp">
            <i class="fa-solid fa-heart"></i>
        </div>
        <h2 class="wow animate__animated animate__fadeInUp" data-wow-delay="0.3s">
            Scroll Triggered Animation
        </h2>
    </div>

    <!-- wow.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>
    <script>
        new WOW().init();
    </script>

</body>

</html>
