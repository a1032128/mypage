<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html and CSS練習-hover</title>
    <style>
        .box {
            width: 200px;
            height: 200px;
            background-color: #FFFF00;
            /* 圓角 */
            border-radius: 5px;
            /* 陰影X軸/Y軸/渲染(模糊)/範圍(大小) */
            box-shadow: 2px 2px 2px 2px #CCccFF;
            /* 內距 */
            /* padding: 25px; */
            /* 固定大小 */
            box-sizing: border-box;
            /* 以下是關於文字的設定 */
            color: blue;
            font-size: 15px;
            /* 水平置中 */
            text-align: center;
            /* 垂直置中 */
            line-height:200px;
            /* 外距 */
            margin:50px;
        }
            /* 設定滑鼠移過去的互動 */
        .box:hover{
            box-shadow: 5px 5px 5px 5px #070707;
            /* 改變，縮放1.1倍 */
            transform: scale(1.1);
            /* 控制"改變(上一行)"的發生時間在0.7秒 */
            transition: transform 0.7s;
        }
    </style>
</head>

<body>
    <div class="box">
        . = class
        div=架構

    </div>

</body>

</html>
