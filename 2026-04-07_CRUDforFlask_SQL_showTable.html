<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD 專案練習 - 顯示產品</title>
    <link rel="stylesheet" href="CSS/BS.css">
    <link rel="stylesheet" href="CSS/css04.css">
    <link rel="stylesheet" href="CSS/table-rwd.css">
</head>

<body>

    <body class="bg-light">
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand fw-900 text-warning" href="#">CRUD</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto.mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="#">首頁</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                產品維護
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="20260310-CRUD-index.html">新增產品</a>
                                </li>
                                <li><a class="dropdown-item active" href="20260310-CRUD-showTable.html">產品列表</a></li>
                            </ul>
                        </li>
                    </ul>
                    <form class="d-flex">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                        <button class="btn btn-outline-success" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>
        <!-- Modal -->
        <div class="modal fade" id="updateModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-warning">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">產品更新</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">

                        <!-- 複製CRUD-index-->

                        <div class="mb-3">
                            <label class="form-label">品名</label>
                            <input type="text" class="form-control" id="modal_name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">價格</label>
                            <input type="number" class="form-control" id="modal_price">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">描述</label>
                            <input type="text" class="form-control" id="modal_description">
                        </div>
                        <!-- 複製CRUD-index的 -->
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" id="update_btn">確認更新</button>
                        <div class="valid-feedback">符合規定</div>
                        <div class="invalid-feedback">不符合規定</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-light">
            <div class="container pt-5">



                <div class="row justify-content-center">
                    <div class="col-md-10 mt-5">
                        <div class="display-4 text-primary fw-900 mb-3 text-center">顯示產品列表</div>
                        <table class="table table-bordered shadow-sm table-rwd">
                            <thead class="table-dark">
                                <tr>
                                    <th>編號</th>
                                    <th>品名</th>
                                    <th>價格</th>
                                    <th>描述</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="mybody">
                                <tr>
                                    <td>XXX</td>
                                    <td>XXX</td>
                                    <td>XXX</td>
                                    <td>XXX</td>
                                    <td>XXX</td>
                                    <td>XXX</td>
                                    <td>
                                        <button class="btn btn-outline-warning" data-bs-toggle="modal"
                                            data-bs-target="#updateModal" data-id="xx" data-name="xxxx"
                                            data-price="xxx">更新</button>
                                        <button class="btn btn-danger deleteBtn data-id=" xx">刪除</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>


        <script src="JS/BS.js"></script>
        <script src="JS/jquery-4.0.0.js"></script>
        <script src="js/sweetalert2@11.js"></script>
        <script>
            // 儲存所有資料
            let data123 = [];
            let uid = 0;

            $(function () {
                // 取得資料
                $.ajax({
                    type: "GET",
                    url: "http://127.0.0.1:5000/products",
                    dataType: "json",

                    success: function (data) {
                        data123 = data.products;
                        renderTable(data123);
                    },
                    error: function () {
                        Swal.fire({
                            title: "讀取失敗",
                            text: "api連結:http://127.0.0.1:5000/products",
                            icon: "error",
                        });
                    }
                });

                // 監聽 table 更新按鈕 .updateBtn，資料來自於ajax必須要使用的監聽方法。因為ajax會最後執行，所以這裡不能用.click
                $(document).on("click", ".updateBtn", function () {
                    //放到modal表單
                    console.log("按鈕的 data:", $(this).data());

                    uid = $(this).data("id");

                    $("#modal_name").val($(this).data("name"));
                    $("#modal_price").val($(this).data("price"));
                    $("#modal_description").val($(this).data("description"));
                });



                //監聽table 刪除按鈕.deleteBtn 資料來自於ajax必須要使用的監聽方法
                $(document).on("click", ".deleteBtn", function () {
                    let delete_id = $(this).data("id")

                    Swal.fire({
                        title: "確認刪除?",
                        showDenyButton: true,
                        showCancelButton: false,
                        icon: "question",
                        confirmButtonText: "確認",
                        denyButtonText: `取消`,
                    }).then((result) => {
                        if (result.isConfirmed) {

                            //傳遞至後端api 執行刪除
                            $.ajax({
                                type: "DELETE",
                                url: `http://127.0.0.1:5000/products/${delete_id}`,
                                dataType: "json",
                                success: function (data) {
                                    console.log(data);
                                    Swal.fire({
                                        title: "刪除成功!",
                                        showDenyButton: false,
                                        showCancelButton: false,
                                        icon: "success",
                                        confirmButtonText: "確認",
                                        denyButtonText: `Don't save`
                                    }).then((result) => {
                                        if (result.isConfirmed) {
                                            location.reload()
                                        }
                                    });
                                },
                                error: function () {
                                    Swal.fire({
                                        title: "刪除失敗",
                                        text: "api連結:http://127.0.0.1:5000/products",
                                        icon: "error",
                                    });
                                }
                            });
                            console.log($(this).data("id"));
                        } else if (result.isDenied) {
                            return;
                        }
                    });



                });

                // 監聽 modal 更新按鈕 #update_btn
                $("#update_btn").click(function () {
                    let name = $("#modal_name").val();
                    let price = Number($("#modal_price").val());
                    let description = $("#modal_description").val();



                    // 傳遞至後端api 執行更新行為 PATCH / posts / :id
                    $.ajax({
                        type: "PUT",
                        url: `http://127.0.0.1:5000/products/${uid}`,
                        contentType: "application/json",
                        data: JSON.stringify({ name: name, price: price, description: description }),
                        success: function (data) {
                            console.log(data);
                            console.log("更新成功!");

                            Swal.fire({
                                title: "更新成功!",
                                showDenyButton: false,
                                showCancelButton: false,
                                icon: "success",
                                confirmButtonText: "確認",
                                denyButtonText: `Don't save`
                            }).then((result) => {
                                if (result.isConfirmed) {
                                    location.reload()
                                }
                            });
                        },
                        error: function () {
                            Swal.fire({
                                title: "更新失敗",
                                text: "api連結:http://127.0.0.1:5000/products",
                                icon: "error",
                            });
                        }
                    });
                }); // ← click 關起來

            }); // ← $(function) 關起來


            //監聽更新按鈕

            function renderTable(data) {
                $("#mybody").empty();
                data.forEach(function (item) {
                    let strHtML = `<tr>
                <td data-th="編號">${item.id}</td>
                <td data-th="品名">${item.name}</td>
                <td data-th="價格">${item.price}</td>
                <td data-th="描述">${item.description ?? '無'}</td>
                <td data-th="操作">
                <button class="btn btn-outline-warning updateBtn"
                data-bs-toggle="modal"
                data-bs-target="#updateModal"
                data-id="${item.id}"
                data-name="${item.name}"
                data-price="${item.price}">更新</button>
                <button class="btn btn-danger deleteBtn" data-id="${item.id}">刪除</button>
                </td>
                </tr>`;
                    $("#mybody").append(strHtML);
                });
            }
        </script>
    </body>

</html>
